% rebase('base.html', title="Home")
<div class="app-container">
    <div class="button-grid">
        <div class="gif-card" onclick="triggerApp('spectrum_visualizer')">
            <div class="media-container">
                <img src="/static/images/spectrum.gif" alt="App One">
            </div>
            <span class="label">Spectrum Visualizer</span>
        </div>
        <div class="gif-card" onclick="triggerApp('strobe_to_beat')">
            <div class="media-container">
                <div class="blinking-square"></div>
            </div>
            <span class="label">Strobe to beat</span>
        </div>
    </div>
</div>

<style>
    .app-container {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 20px;
        font-family: sans-serif;
    }

    .button-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 30px;
        width: 100%;
        max-width: 600px;
    }

    .gif-card {
        background: #444;
        border: 2px solid #555;
        border-radius: 8px;
        padding: 15px;
        text-align: center;
        cursor: pointer;
        transition: transform 0.2s, border-color 0.2s;
    }

    .gif-card:hover {
        transform: scale(1.05);
        border-color: #ff0000; 
        background: #4a4a4a;
    }

    .media-container {
        width: 100%;
        aspect-ratio: 1 / 1;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #222;
        border-radius: 4px;
        margin-bottom: 15px;
        overflow: hidden;
    }

    .media-container img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .blinking-square {
        width: 60%;
        height: 60%;
        background-color: white;
        animation: blink-animation 0.5s step-end infinite;
    }

    @keyframes blink-animation {
        0% { opacity: 1; }
        50% { opacity: 0; }
    }

    .gif-card .label {
        color: white;
        font-weight: bold;
        text-transform: uppercase;
        font-size: 14px;
        letter-spacing: 1px;
    }
</style>

<script>
    function triggerApp(appName) {
        console.log("Requesting: " + appName);

        fetch('/trigger_musicsync', {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json' 
            },
            body: JSON.stringify({ app_id: appName })
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('Network response was not ok');
            }
            return response.json();
        })
        .then(data => {
            console.log("Success:", data);
        })
        .catch(err => {
            console.error("Error triggering application:", err);
        });
    }
</script>
