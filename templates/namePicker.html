% rebase('base.html', title="Name Picker")

<div class="app-container">
    <div class="button-grid">
        <div class="gif-card" onclick="triggerApp('name_picker')">
            <div class="media-container">
                <div class="name-placeholder">?</div>
            </div>
            <span class="label">Start Name Picker</span>
        </div>

        <div class="slurke-control-panel">
            <div class="slider-section">
                <label id="max-label" class="slider-label">Max slurke: 5</label>
                <input type="range" id="max-val" min="1" max="10" value="5" class="max-slider" 
                    oninput="updateSliderLabel(this.value)"
                    onchange="saveSliderValue(this.value)">
            </div>
            
            <button class="trigger-btn-large" onclick="updateAndTrigger()">
                Skiltet vælger
            </button>
        </div>
    </div>

    <div class="settings-container">
        <h3>Name Picker Settings</h3>
        
        <form action="/settings/update" method="post" class="settings-form">
            % for key, value in settings.items():
                % if key.startswith("name_picker"):
                    <div class="setting-group">
                        <label for="{{key}}">{{key.replace('name_picker_', '').replace('_', ' ').upper()}}</label>
                        
                        % if isinstance(value, list):
                            <input type="text" name="{{key}}" value="{{', '.join(value)}}" placeholder="item1, item2, item3">
                            <small>List of values (comma-separated)</small>
                        % elif isinstance(value, bool):
                            <div class="toggle-wrapper">
                                <input type="hidden" name="{{key}}" value="false">
                                <label class="switch">
                                    <input type="checkbox" 
                                        name="{{key}}" 
                                        id="{{key}}" 
                                        value="true"
                                        class="toggle-switch"
                                        {{'checked' if value else ''}}>
                                    <span class="slider round"></span>
                                </label>
                            </div>
                        % else:
                            <input type="text" name="{{key}}" value="{{value}}">
                        % end
                    </div>
                % end
            % end
            
            <div class="form-actions">
                <button type="submit" class="action-btn">SAVE SETTINGS</button>
            </div>
        </form>
    </div>
</div>

<style>
    .app-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 20px;
        font-family: sans-serif;
        gap: 40px;
    }

    .button-grid {
        width: 100%;
        max-width: 300px;
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .gif-card {
        background: #222; 
        border: 2px solid #444;
        border-radius: 8px; 
        padding: 20px;
        text-align: center;
        cursor: pointer;
        transition: transform 0.2s, border-color 0.2s;
    }

    .gif-card:hover {
        transform: scale(1.05);
        border-color: #ff0000;
    }

    .media-container {
        width: 100%;
        aspect-ratio: 1 / 1;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #111;
        border-radius: 4px;
        margin-bottom: 15px;
    }

    .name-placeholder {
        color: white;
        font-size: 64px;
        font-weight: bold;
    }

    .trigger-btn {
        background: none;
        border: none;
        color: white;
        cursor: pointer;
        width: 100%;
    }

    .label {
        color: white;
        font-weight: bold;
        text-transform: uppercase;
        font-size: 14px;
        letter-spacing: 1px;
    }

    .settings-container {
        width: 100%;
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
        background: #222;
        border-radius: 8px;
        color: white;
    }

    .settings-container h3 {
        margin-top: 0;
        margin-bottom: 20px;
        font-size: 1.2rem;
        border-bottom: 1px solid #444;
        padding-bottom: 10px;
        color: #ccc;
    }

    .settings-form {
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .setting-group {
        display: flex;
        flex-direction: column;
        gap: 5px;
        padding-bottom: 15px;
        border-bottom: 1px solid #444;
    }

    .setting-group label {
        font-weight: bold;
        color: #ccc;
        font-size: 0.9rem;
    }

    .setting-group input[type="text"] {
        background: #333;
        border: 1px solid #555;
        color: white;
        padding: 10px;
        border-radius: 4px;
        font-size: 16px;
    }

    .setting-group small {
        color: #888;
        font-style: italic;
        margin-top: 5px;
    }

    .form-actions {
        margin-top: 10px;
        text-align: right;
    }

    .action-btn {
        background: #4CAF50;
        color: white;
        border: none;
        padding: 12px 24px;
        font-weight: bold;
        border-radius: 4px;
        cursor: pointer;
        transition: opacity 0.2s;
    }

    .action-btn:hover {
        opacity: 0.9;
    }

    .toggle-switch {
        width: 20px;
        height: 20px;
        cursor: pointer;
    }

    .slurke-control-panel {
        width: 100%;
        max-width: 300px;
        background: #1a1a1a;
        padding: 25px;
        border-radius: 12px;
        border: 1px solid #333;
        text-align: center;
        box-sizing: border-box;
    }

    .slider-section {
        margin-bottom: 20px;
    }

    .slider-label {
        color: white;
        font-size: 22px;
        font-weight: bold;
        display: block;
        margin-bottom: 12px;
    }

    .max-slider {
        width: 100%;
        cursor: pointer;
    }

    .trigger-btn-large {
        width: 100%;
        background: red;
        color: white;
        border: none;
        padding: 15px 10px;
        border-radius: 8px;
        font-weight: bold;
        font-size: 20px;
        letter-spacing: 1px;
        cursor: pointer;
        transition: transform 0.2s ease-in-out, background 0.2s;
        text-transform: uppercase;
    }

    .trigger-btn-large:hover {
        transform: scale(1.08);
    }

    .trigger-btn-large:active {
        transform: scale(0.95);
    }

    @media (max-width: 600px) {
        .settings-container {
            width: 260px;
        }
    }
</style>

<script>
    function triggerApp(appName) {
        return fetch('/trigger_namePicker', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' }
        })
        .then(response => response.text())
        .then(data => console.log("App Triggered:", data))
        .catch(err => console.error("Error triggering app:", err));
    }

    function updateSliderLabel(val) {
        document.getElementById('max-label').innerText = 'Max slurke: ' + val;
    }

    function saveSliderValue(val) {
        localStorage.setItem('namePickerMaxSlurke', val);
    }

    function loadSavedSliderValue() {
        const savedValue = localStorage.getItem('namePickerMaxSlurke');
        if (savedValue) {
            const slider = document.getElementById('max-val');
            slider.value = savedValue;
            updateSliderLabel(savedValue);
        }
    }

    document.addEventListener('DOMContentLoaded', loadSavedSliderValue);

    async function updateAndTrigger() {
        const maxVal = document.getElementById('max-val').value;
        
        const randomNumber = Math.floor(Math.random() * maxVal) + 1;
        const text = `Drik ${randomNumber}`;

        const formData = new URLSearchParams();
        formData.append('name_picker_top_text', text);
        formData.append('name_picker_bottom_text', text);

        try {
            
            const updateResponse = await fetch('/settings/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData
            });

            if (updateResponse.ok) {
                console.log("Settings updated successfully");
                await triggerApp('name_picker');
            } else {
                console.error("Failed to update settings");
            }
        } catch (error) {
            console.error("Workflow error:", error);
        }
    }
</script>
